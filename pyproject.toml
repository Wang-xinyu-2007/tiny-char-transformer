[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-char-transformer"
version = "0.1.0"
description = "A compact GPT-style character-level Transformer implemented in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["matplotlib>=3.8", "pytest>=8"]
train = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["charformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
